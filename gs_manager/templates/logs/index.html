{% extends 'base.html' %}

{% block header %}
  {% block title %}Logs{% endblock %}
{% endblock %}

{% block content %}
<style>
  .log-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
  .log-controls select, .log-controls input[type=text] { max-width: 100%; }
  #log_out { height: 60vh; overflow: auto; margin: 0; padding: 8px; white-space: pre-wrap; word-break: break-all;
             font-family: monospace; font-size: 12px; background: #111; color: #ddd; }
  #log_out.error { color: #f88; }
  #log_status { font-size: 12px; opacity: 0.8; }
  .log-levels { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 8px; font-size: 13px; }
  .log-levels .cnt { opacity: 0.7; }
  #log_out .l-error { color: #ff6b6b; }
  #log_out .l-warning { color: #f5c542; }
  #log_out .l-connection { color: #6bc5ff; }
</style>
<div class="log-controls">
  <select id="log_type">
    <option value="container">Game server</option>
    <option value="journal">Service (systemd)</option>
    <option value="file">Volume log file</option>
    <option value="docker">Docker</option>
  </select>
  <select id="log_source"></select>
  <label>Lines <select id="log_lines">
    <option>100</option><option selected>500</option><option>1000</option><option>5000</option>
  </select></label>
  <label><input type="checkbox" id="log_auto" checked> Auto-refresh</label>
  <select id="log_interval">
    <option value="2000">2s</option><option value="5000" selected>5s</option><option value="10000">10s</option>
    <option value="30000">30s</option>
  </select>
  <button type="button" id="log_refresh">Refresh</button>
  <input type="text" id="log_filter" placeholder="Filter lines">
  <button type="button" id="log_download">Download</button>
</div>
<div class="log-levels" id="log_levels">
  <span>Only show:</span>
  <label><input type="checkbox" value="error"> Errors <span class="cnt" data-cnt="error"></span></label>
  <label><input type="checkbox" value="warning"> Warnings <span class="cnt" data-cnt="warning"></span></label>
  <label><input type="checkbox" value="connection"> Player connections <span class="cnt" data-cnt="connection"></span></label>
  <button type="button" id="log_only_problems">Errors + warnings only</button>
  <button type="button" id="log_all_levels">Show everything</button>
</div>
<div id="log_status"></div>
<pre id="log_out"></pre>
{% endblock %}

{% block scripts %}
<script>
  $(document).ready(function () {
    var sources = {};
    var raw = "";
    var timer = null;
    var inflight = false;
    var out = document.getElementById('log_out');

    function store(key, val) { try { localStorage.setItem('logs_' + key, val); } catch (e) {} }
    function load(key) { try { return localStorage.getItem('logs_' + key); } catch (e) { return null; } }

    // Lines are sorted into categories by keyword, and a line can match several. With no box ticked every line is
    // shown; ticking boxes narrows the view to lines in any ticked category.
    var PATTERNS = {
      error: /\b(error|errors|exception|traceback|fatal|critical|crit|failed|failure|panic|segfault|conflict|denied|refused|timed out|timeout|oom|killed)\b/i,
      warning: /\b(warn|warning|warnings|deprecated|retry|retrying)\b/i,
      connection: /\b(login|logout|logged (in|on|off)|connect(ed|ion)?|disconnect(ed)?|joined|left the|kicked|banned)\b/i
    };
    // A row of the periodic "status" player table, e.g. "<time> 1 | Name | 10.0.0.5 | Character | KEY".
    // The header row ("ID | Player Name | ...") has no numeric id, so empty polls don't match.
    var PLAYER_ROW = /(^|\s)\d+\s*\|\s*\S/;
    var CATEGORIES = ['error', 'warning', 'connection'];
    var TRACE_END = /\b[\w.]*(Error|Exception)\b.*:/;

    function classify(lines) {
      var cats = [], inTrace = false;
      lines.forEach(function (line) {
        var c = [];
        if (inTrace) {
          // Everything in a python traceback counts as an error, up to and including the exception line
          c.push('error');
          if (TRACE_END.test(line) && !/Traceback/.test(line)) inTrace = false;
        } else {
          if (/Traceback \(most recent call last\)/.test(line)) { inTrace = true; c.push('error'); }
          ['error', 'warning', 'connection'].forEach(function (k) {
            if (c.indexOf(k) === -1 && PATTERNS[k].test(line)) c.push(k);
          });
          if (c.indexOf('connection') === -1 && PLAYER_ROW.test(line)) c.push('connection');
        }
        cats.push(c);
      });
      return cats;
    }

    function enabledCategories() {
      var on = {};
      $('#log_levels input:checked').each(function () { on[this.value] = true; });
      return on;
    }

    function render() {
      var f = $('#log_filter').val().toLowerCase();
      var on = enabledCategories();
      var lines = raw.split('\n');
      var cats = classify(lines);
      var counts = {error: 0, warning: 0, connection: 0};
      var anyOn = Object.keys(on).length > 0;
      var frag = document.createDocumentFragment();
      lines.forEach(function (line, i) {
        if (!line.trim()) return;
        cats[i].forEach(function (k) { counts[k]++; });
        if (f && line.toLowerCase().indexOf(f) === -1) return;
        if (anyOn && !cats[i].some(function (k) { return on[k]; })) return;
        var span = document.createElement('span');
        // Colour by the most severe category the line belongs to
        var first = CATEGORIES.find(function (k) { return cats[i].indexOf(k) !== -1; });
        if (first) span.className = 'l-' + first;
        span.textContent = line + '\n';
        frag.appendChild(span);
      });
      CATEGORIES.forEach(function (k) { $('[data-cnt=' + k + ']').text('(' + counts[k] + ')'); });
      var atBottom = out.scrollHeight - out.scrollTop - out.clientHeight < 30;
      out.textContent = '';
      out.appendChild(frag);
      if (atBottom) out.scrollTop = out.scrollHeight;
    }

    function setLevels(values) {
      $('#log_levels input').each(function () { this.checked = values.indexOf(this.value) !== -1; });
      store('only', values.join(','));
      render();
    }

    function fillSources(keepValue) {
      var type = $('#log_type').val();
      var $s = $('#log_source').empty();
      (sources[type] || []).forEach(function (s) { $s.append($('<option>').val(s.id).text(s.name)); });
      if (keepValue && $s.find('option').filter(function () { return this.value === keepValue; }).length) {
        $s.val(keepValue);
      }
      if (!(sources[type] || []).length) $s.append($('<option>').val('').text('(none available)'));
    }

    function fetchLogs() {
      var type = $('#log_type').val(), id = $('#log_source').val();
      if (inflight || !id) return;
      inflight = true;
      fetch('/logs/data?' + new URLSearchParams({type: type, id: id, lines: $('#log_lines').val()}))
        .then(function (r) {
          if (r.redirected) { window.location.reload(); throw new Error('login required'); }
          return r.json();
        })
        .then(function (d) {
          raw = d.text;
          out.classList.toggle('error', !d.ok);
          render();
          $('#log_status').text('Updated ' + new Date().toLocaleTimeString());
        })
        .catch(function (e) { $('#log_status').text('Request failed: ' + e); })
        .finally(function () { inflight = false; });
    }

    function schedule() {
      if (timer) clearInterval(timer);
      timer = null;
      if ($('#log_auto').is(':checked')) {
        timer = setInterval(function () { if (!document.hidden) fetchLogs(); }, parseInt($('#log_interval').val(), 10));
      }
    }

    $('#log_type').on('change', function () { store('type', this.value); fillSources(); store('source', $('#log_source').val()); fetchLogs(); });
    $('#log_source').on('change', function () { store('source', this.value); fetchLogs(); });
    $('#log_lines').on('change', function () { store('lines', this.value); fetchLogs(); });
    $('#log_auto').on('change', function () { store('auto', this.checked ? '1' : '0'); schedule(); });
    $('#log_interval').on('change', function () { store('interval', this.value); schedule(); });
    $('#log_refresh').on('click', fetchLogs);
    $('#log_filter').on('input', render);
    $('#log_levels input').on('change', function () {
      store('only', $('#log_levels input:checked').map(function () { return this.value; }).get().join(','));
      render();
    });
    $('#log_only_problems').on('click', function () { setLevels(['error', 'warning']); });
    $('#log_all_levels').on('click', function () { setLevels([]); });
    $('#log_download').on('click', function () {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([raw], {type: 'text/plain'}));
      a.download = ($('#log_type').val() + '_' + $('#log_source').val()).replace(/[^\w.-]+/g, '_') + '.log';
      a.click();
      URL.revokeObjectURL(a.href);
    });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) fetchLogs(); });

    // Restore the previous selections
    if (load('lines')) $('#log_lines').val(load('lines'));
    if (load('interval')) $('#log_interval').val(load('interval'));
    if (load('auto') === '0') $('#log_auto').prop('checked', false);
    if (load('type')) $('#log_type').val(load('type'));
    if (load('only')) {
      var saved = load('only').split(',');
      $('#log_levels input').each(function () { this.checked = saved.indexOf(this.value) !== -1; });
    }

    fetch('/logs/sources').then(function (r) { return r.json(); }).then(function (d) {
      sources = d;
      fillSources(load('source'));
      schedule();
      fetchLogs();
    });
  });
</script>
{% endblock %}
